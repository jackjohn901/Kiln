kind = "web"
previewPath = "/discover/"
title = "Habatat — Artist Discovery"
version = "1.0.0"
id = "artifacts/habatat-discover"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/discover/" ]
localPort = 21955

[services.development]
run = "pnpm --filter @workspace/habatat-discover run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habatat-discover", "run", "build" ]
publicDir = "artifacts/habatat-discover/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21955"
BASE_PATH = "/discover/"
