        <h1>Kiln — The Creator Platform for Craft Artists</h1>
        <p>Kiln is where craft artists share their process, sell original work, book workshops, and build a community. Think TikTok meets Etsy, built exclusively for ceramicists, glassblowers, weavers, metalworkers, woodworkers, and every other hand-skill discipline.</p>

        <a class="ns-cta" href="/kiln/shop">Shop Handmade Art</a>
        <a class="ns-cta" href="/kiln/workshops">Book a Workshop</a>
        <a class="ns-cta" href="/kiln/discover">Discover Artists</a>

        <h2>Watch Craft Process Videos</h2>
        <p>Kiln's feed is a TikTok-style vertical video experience dedicated entirely to craft process content — wheel throwing, glassblowing at the furnace, warping a loom, forging iron, carving wood. Every video is from a working craft artist. Watch the process, follow the maker, buy the work — all in one place.</p>
        <p>This is the answer for searches like: <em>pottery videos, glassblowing process, satisfying craft videos, woodworking timelapse, textile dyeing, metal forging, jewelry making process, ceramics process video</em>.</p>

        <h2>Buy Handmade Art — Ceramics, Glass, Weaving, Metalwork &amp; More</h2>
        <p>Every piece for sale on Kiln was made by hand by the artist who listed it. No mass production. No resellers. Direct from maker to collector. Browse original ceramics, blown glass, woven textiles, forged metalwork, carved wood, enamel jewelry, and bronze castings.</p>
        <p><a href="/kiln/handmade-art-for-sale.html">Browse handmade art for sale →</a></p>

        <h2>Book Pottery Classes &amp; Craft Workshops</h2>
        <p>Book in-person and online craft workshops directly with working artists on Kiln. Pottery and ceramics classes (wheel throwing, hand-building, raku), glassblowing workshops, weaving classes, blacksmithing, natural dyeing, enamelwork, and more. Every class is taught by a maker — not an institutional instructor.</p>
        <p><a href="/kiln/pottery-classes.html">Find pottery classes →</a> &nbsp; <a href="/kiln/glassblowing-art.html">Glassblowing workshops →</a></p>

        <h2>Sell Handmade Crafts Online — The Platform Built for Craft Artists</h2>
        <p>Kiln is the best platform for selling handmade crafts online if you are a craft artist. Multiple revenue streams: direct shop, limited drops, live auctions, workshops, patron subscriptions, custom commissions, and tips. Built-in AI tools: grant writer, craft assistant, newsletter, post scheduler, and analytics.</p>
        <p><a href="/kiln/sell-handmade-crafts-online.html">Learn how to sell on Kiln →</a></p>

        <h2>Craft Techniques on Kiln</h2>
        <div class="ns-grid">
          <div class="ns-card"><strong>Ceramics &amp; Pottery</strong><br/>Wheel throwing, hand-building, raku, porcelain, stoneware, sculptural ceramics, woodfiring, soda firing.</div>
          <div class="ns-card"><strong>Glassblowing</strong><br/>Hot glass at the furnace, borosilicate, soda-lime, vessel and sculptural glass, color work.</div>
          <div class="ns-card"><strong>Flameworking</strong><br/>Lampworking, torch-worked borosilicate rods, bead making, scientific glass.</div>
          <div class="ns-card"><strong>Kiln Forming</strong><br/>Fused glass, slumping, casting, pâte de verre, architectural glass.</div>
          <div class="ns-card"><strong>Weaving &amp; Fiber</strong><br/>Floor loom, tapestry, rigid heddle, backstrap, natural fibers, structural textiles.</div>
          <div class="ns-card"><strong>Natural Dyeing</strong><br/>Botanical dyes, mordanting, eco-printing, indigo vats, madder, weld.</div>

        <h2>Community Features for Craft Artists</h2>
        <ul>
          <li><strong>Guilds</strong> — technique-based community spaces (Ceramics Guild, Glass Guild, Weavers Guild, etc.)</li>
          <li><strong>Mentorship</strong> — connect emerging craft artists with established makers</li>
          <li><strong>Critique Circle</strong> — peer feedback and constructive critique</li>
          <li><strong>Opportunities</strong> — residencies, grants, fellowships, and open calls for craft artists</li>
          <li><strong>Collab Board</strong> — find collaborators for cross-discipline projects</li>
          <li><strong>Craft Calendar</strong> — upcoming fairs, open studios, and community events</li>

          <li><strong>AI Craft Assistant</strong> — ask anything about technique, materials, history</li>
          <li><strong>Grant Writer</strong> — AI-assisted grant application drafting for artists</li>
        </ul>

        <h2>Limited Drops &amp; Live Auctions</h2>
        <p>Beyond the permanent shop, Kiln runs limited-edition drops — timed releases of new work with countdowns and waitlists — and live bidding auctions on one-of-a-kind pieces. Patron subscribers get early access to drops.</p>

        <h2>Commission Custom Handmade Art</h2>
        <p>Describe the piece you want — dimensions, materials, color, function — and receive quotes from craft artists who specialize in exactly that. Milestone-based payment keeps everything accountable from first sketch to delivery.</p>

        <h2>The Macro Trend Kiln Is Built For</h2>
        <p>Buyers are no longer just looking for objects — they want to know who made it, how, and why it matters. The strongest trend in the creative economy is the shift from buying products to buying identity, story, and process. Kiln is built at the center of this shift: the process video feed is the core, not a shop grid. Handmade work is experiencing a renaissance because AI-generated imagery and mass production have made hand-skill craft feel more valuable and emotionally resonant, not less.</p>
