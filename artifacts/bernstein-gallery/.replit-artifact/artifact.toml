kind = "web"
previewPath = "/"
title = "Alex Bernstein Glass Art"
version = "1.0.0"
id = "artifacts/bernstein-gallery"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21140

[services.development]
run = "pnpm --filter @workspace/bernstein-gallery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bernstein-gallery", "run", "build" ]
publicDir = "artifacts/bernstein-gallery/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21140"
BASE_PATH = "/"
