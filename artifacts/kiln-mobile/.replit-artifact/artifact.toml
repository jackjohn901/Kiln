kind = "mobile"
previewPath = "/mobile/"
title = "Kiln Mobile"
version = "1.0.0"
id = "artifacts/kiln-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22098

[services.development]
run = "pnpm --filter @workspace/kiln-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kiln-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kiln-mobile", "run", "serve" ]

[services.env]
PORT = "22098"
BASE_PATH = "/mobile/"
