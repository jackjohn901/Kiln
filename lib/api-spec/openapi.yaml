openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: instagram
    description: Instagram media feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /instagram/feed:
    get:
      operationId: getInstagramFeed
      tags: [instagram]
      summary: Get Instagram video feed
      description: Returns recent video posts from the connected Instagram account
      responses:
        "200":
          description: Video feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramFeed"
        "503":
          description: Instagram not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    InstagramVideo:
      type: object
      properties:
        id:
          type: string
        media_type:
          type: string
        media_url:
          type: ["string", "null"]
        thumbnail_url:
          type: ["string", "null"]
        permalink:
          type: string
        timestamp:
          type: string
        caption:
          type: ["string", "null"]
      required:
        - id
        - media_type
        - permalink
        - timestamp
    InstagramFeed:
      type: object
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/InstagramVideo"
      required:
        - videos
